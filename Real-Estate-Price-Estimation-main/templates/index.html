<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Estate Price Prediction</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>

<body>
    <div class="container py-4">
        <h1 class="text-center mb-4">🏡 House Value Prediction</h1>

        <!-- Error message -->
        {% if error %}
        <div class="alert alert-danger text-center">
            {{ error }}
        </div>
        {% endif %}

        <!-- Prediction result -->
        {% if prediction %}
        <div class="alert alert-success text-center">
            Estimated Value: <strong>{{ prediction }} Lakhs</strong>
        </div>
        {% endif %}

        <form action="/predict" method="post" class="row g-3">

            <!-- Numeric inputs with min="0" -->
            <div class="col-md-6">
                <label for="area" class="form-label">Area (in square feet)</label>
                <input type="number" class="form-control" id="area" name="area" min="1" required />
            </div>
            <div class="col-md-6">
                <label for="bedrooms" class="form-label">Number of bedrooms</label>
                <input type="number" class="form-control" id="bedrooms" name="bedrooms" min="0" required />
            </div>
            <div class="col-md-6">
                <label for="bathrooms" class="form-label">Number of bathrooms</label>
                <input type="number" class="form-control" id="bathrooms" name="bathrooms" min="0" required />
            </div>
            <div class="col-md-6">
                <label for="stories" class="form-label">Number of stories</label>
                <input type="number" class="form-control" id="stories" name="stories" min="0" required />
            </div>

            <!-- Yes/No radio groups with required -->
            <div class="col-md-6">
                <label class="form-label">Is the house close to main road?</label><br />
                <input type="radio" class="form-check-input" name="mainroad" value="yes" required id="mainroadYes">
                <label for="mainroadYes" class="form-check-label">Yes</label>
                <input type="radio" class="form-check-input ms-3" name="mainroad" value="no" id="mainroadNo">
                <label for="mainroadNo" class="form-check-label">No</label>
            </div>

            <div class="col-md-6">
                <label class="form-label">Is guest room available?</label><br />
                <input type="radio" class="form-check-input" name="guestroom" value="yes" required id="guestYes">
                <label for="guestYes" class="form-check-label">Yes</label>
                <input type="radio" class="form-check-input ms-3" name="guestroom" value="no" id="guestNo">
                <label for="guestNo" class="form-check-label">No</label>
            </div>

            <div class="col-md-6">
                <label class="form-label">Does the house have basement?</label><br />
                <input type="radio" class="form-check-input" name="basement" value="yes" required id="baseYes">
                <label for="baseYes" class="form-check-label">Yes</label>
                <input type="radio" class="form-check-input ms-3" name="basement" value="no" id="baseNo">
                <label for="baseNo" class="form-check-label">No</label>
            </div>

            <div class="col-md-6">
                <label class="form-label">Is water heating facility available?</label><br />
                <input type="radio" class="form-check-input" name="hotwaterheating" value="yes" required id="hotYes">
                <label for="hotYes" class="form-check-label">Yes</label>
                <input type="radio" class="form-check-input ms-3" name="hotwaterheating" value="no" id="hotNo">
                <label for="hotNo" class="form-check-label">No</label>
            </div>

            <div class="col-md-6">
                <label class="form-label">Is Air Conditioning available?</label><br />
                <input type="radio" class="form-check-input" name="airconditioning" value="yes" required id="acYes">
                <label for="acYes" class="form-check-label">Yes</label>
                <input type="radio" class="form-check-input ms-3" name="airconditioning" value="no" id="acNo">
                <label for="acNo" class="form-check-label">No</label>
            </div>

            <div class="col-md-6">
                <label class="form-label">Is the house in a preferred area?</label><br />
                <input type="radio" class="form-check-input" name="prefarea" value="yes" required id="prefYes">
                <label for="prefYes" class="form-check-label">Yes</label>
                <input type="radio" class="form-check-input ms-3" name="prefarea" value="no" id="prefNo">
                <label for="prefNo" class="form-check-label">No</label>
            </div>

            <!-- Dropdowns -->
            <div class="col-md-6">
                <label for="parking" class="form-label">Number of parking spaces</label>
                <select name="parking" id="parking" class="form-select" required>
                    <option value="" disabled selected>-- select --</option>
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </div>

            <div class="col-md-6">
                <label for="furnishing_status" class="form-label">Furnishing status</label>
                <select name="furnishing_status" id="furnishing_status" class="form-select" required>
                    <option value="" disabled selected>-- select --</option>
                    <option value="furnished">Furnished</option>
                    <option value="semi-furnished">Semi-Furnished</option>
                    <option value="unfurnished">Unfurnished</option>
                </select>
            </div>

            <!-- Submit -->
            <div class="col-12 text-center mt-3">
                <button type="submit" class="btn btn-primary btn-lg">Predict</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
</body>

</html>
